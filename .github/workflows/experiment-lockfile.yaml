name: 单变量实验 lockfile 刷新

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-workspace.yaml"
      - "apps/*/package.json"
      - "packages/*/package.json"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    name: 仅刷新实验分支 pnpm-lock.yaml
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'experiment/')
    runs-on: ubuntu-latest
    steps:
      - name: 检出实验 PR 工作分支
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 仅重新解析 lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: 校验写入范围并提交 lockfile
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "依赖树没有变化，无需提交。"
            exit 0
          fi

          unexpected="$(printf '%s\n' "$changed" | grep -v '^pnpm-lock.yaml$' || true)"
          if [ -n "$unexpected" ]; then
            echo "实验 lockfile workflow 检测到非 pnpm-lock.yaml 变更，拒绝自动提交："
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "📦 deps: 刷新单变量实验依赖树"
          git push origin "HEAD:${{ github.head_ref }}"
