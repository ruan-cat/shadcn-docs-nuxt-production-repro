name: 部署 docs 到 Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "packages/**"
      - ".github/workflows/deploy-cloudflare.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-docs
  cancel-in-progress: false

jobs:
  deploy-docs-worker:
    name: 构建 docs（cloudflare_module）并部署 Worker
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装冻结依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 workspace 包
        run: pnpm build:packages

      - name: 构建 docs（Cloudflare Workers 预设）
        run: pnpm --filter @repro/docs exec nuxt build
        env:
          NITRO_PRESET: cloudflare_module

      - name: 校验 Worker 产物
        run: |
          test -f apps/docs/.output/server/index.mjs
          test -d apps/docs/.output/public
          echo "worker 产物闭包校验通过"

      - name: 凭据存在性检查
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "CF_CREDENTIALS_PRESENT=true" >> "$GITHUB_ENV"
          else
            echo "CF_CREDENTIALS_PRESENT=false" >> "$GITHUB_ENV"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN secret，本次跳过部署（git 触发流水线已就绪，配置 secret 后下一次 push 自动部署）"
          fi

      - name: 部署 Cloudflare Worker
        if: env.CF_CREDENTIALS_PRESENT == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/docs
          command: deploy
